<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
    <header class="header-container">
        <h1 class="site-name">MyFitnessApp</h1>

        <nav class="nav-wrapper">
            <a class="header-item" href="/home">Home</a>
            <a class="header-item" href="/food">Food/Recipes</a>
            <a class="header-item" href="/workout">Weights</a>
            <a class="header-item" href="/profile">Profile</a>
        </nav>

        <div class="profile-circle">
            <img src="https://via.placeholder.com/50" alt="Profile Picture" />
        </div>
    </header>

    <section>

    <section class="users-info">
        <button class="macro-info-btn" id="macro-info-btn">Macro Intake</button>
        <button class="body-info-btn" id="body-info-btn">Body Measurements</button>
        <button class="history-info-btn" id="history-info-btn">Workout History</button>
    </section>

    <section id="macro-chart" >
        <h1>Macro Intake</h1>
        <section id="macro-container" class="macro-container">
            <section id="chartHeader">
                <canvas id="myChart" ></canvas>        
            </section>
            <section id="foods-added"></section>
        </section>
    </section>


    <section id="body-info" class="hidden">
        <section class="body-inputs">
            <h1>SLKDJFLKSDJFLK</h1>
            <input placeholder="Input body weight" class="body-inputbox-class" id="body-inputbox-id">
            <button class="body-submit" id="body-submit-id">Submit</button>
        </section>



        <section class="date-entry-log" id="entry-log">
            <h1>Measurements</h1>
            <section id="bodyChart">
                <canvas id="bodyWeightChart"></canvas>
            </section>
            <section id="weight-log">
                <section id="daily-weight"></section>
                <section id="monthly-weight"></section>
                <section id="yearly-weight"></section>
            </section>
        </section>
    </section>


    <section id="history-info" class="hidden">
        
        <section class="workout-wrapper">
            <header class="workout-conatiner">
                <button class="prev-month">←</button>
                <title class="month-year"></title>
                <button class="next-month">→</button>
            </header>
            <section class="workout-grid-con"></section>
            <section class="workout-description"></section>
        </section>

    </section>


    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
    <script type="module" src="/js/index.js"></script>
    <script type="module" src="./js/bodyWeights.js"></script>
</body>
</html>
